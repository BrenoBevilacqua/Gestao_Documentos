{% csrf_token %}
{% if form.non_field_errors %}<div class="alert alert-danger">{{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}
  <div class="mb-3">
    <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="text-danger">*</span>{% endif %}</label>
    {% if field.errors %}
      <div class="is-invalid">{{ field }}</div>
      <div class="invalid-feedback d-block">{{ field.errors|join:" " }}</div>
    {% else %}{{ field }}{% endif %}
    {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
  </div>
{% endfor %}
