<form method="get" class="row g-2 mb-3">
  <div class="col-md">
    <div class="input-group">
      <span class="input-group-text"><i class="bi bi-search"></i></span>
      <input type="search" name="q" value="{{ q }}" class="form-control" placeholder="{{ placeholder|default:'Pesquisar...' }}">
    </div>
  </div>
  {% if situacoes %}
  <div class="col-md-3">
    <select name="situacao" class="form-select">
      <option value="">Todas as situações</option>
      {% for valor, rotulo in situacoes %}<option value="{{ valor }}" {% if situacao == valor %}selected{% endif %}>{{ rotulo }}</option>{% endfor %}
    </select>
  </div>
  {% endif %}
  <div class="col-auto">
    <button class="btn btn-primary" type="submit">Filtrar</button>
    {% if q or situacao %}<a class="btn btn-outline-secondary" href="?">Limpar</a>{% endif %}
  </div>
</form>
